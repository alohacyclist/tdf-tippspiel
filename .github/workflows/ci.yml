name: ci

# Vercel deployt automatisch: jeder Push auf main geht in die Produktion, jeder
# PR bekommt einen Preview. Dieser Workflow ist das Netz davor — er baut und
# testet dieselbe Revision, damit ein roter Build im PR sichtbar wird, statt
# erst im Deployment aufzuschlagen.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # dieselben Env-Namen wie Vercel; die Werte sind im Build nur Platzhalter,
      # der Bundle-Build prüft hier Typen und Imports, nicht die Verbindung.
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
